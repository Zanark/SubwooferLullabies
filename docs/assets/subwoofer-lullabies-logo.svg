    <path d="M922 183h35v-38h28v58h28v-92h28v72h28v-44h28v26h35"
          stroke="#6ba9a1" stroke-width="8" opacity="0.8"/>
  </g>
  <g filter="url(#pixel-shadow)" font-family="'Courier New', Consolas, monospace" font-weight="900" letter-spacing="-7">
    <text x="54" y="143" font-size="92" fill="url(#mint)">subwoofer</text>
    <text x="535" y="143" font-size="92" fill="url(#orange)">lullabies</text>
  </g>
  <g fill="#e7d6a7" font-family="'Courier New', Consolas, monospace" font-size="18" font-weight="700" letter-spacing="6">
    <text x="390" y="205">ORIGINAL MUSIC / CODE-COMPOSED TAPES</text>
  </g>
